<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rara Cosmetics</title>
  <!-- Feather Icons -->
  <script src="https://unpkg.com/feather-icons"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* RESET & BASE STYLES */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --primary: #F8BBD0;
      --secondary: #FCE4EC;
      --accent: #EC407A;
      --accent-dark: #D81B60;
      --bg: #FFF9FB;
      --surface: #FFFFFF;
      --text: #444444;
      --text-light: #888888;
      --shadow: 0 4px 20px rgba(236, 64, 122, 0.08);
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
      --radius: 16px;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      box-shadow: 0 0 30px rgba(0,0,0,0.05);
      padding-bottom: 70px;
    }

    button {
      cursor: pointer;
      border: none;
      outline: none;
      font-family: inherit;
    }

    input, select, textarea {
      font-family: inherit;
      outline: none;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* TOAST NOTIFICATION */
    #toast {
      position: fixed;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface);
      color: var(--text);
      border-left: 4px solid var(--accent);
      padding: 12px 20px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      z-index: 9999;
      font-size: 13px;
      font-weight: 600;
      transition: top 0.4s ease;
      width: 90%;
      max-width: 400px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #toast.show {
      top: 20px;
    }

    /* HEADER */
    .header {
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      z-index: 100;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-sm);
    }
    .header .logo {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.5px;
    }
    .header .role-badge {
      font-size: 10px;
      background: var(--secondary);
      color: var(--accent);
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 700;
      margin-left: 6px;
      text-transform: uppercase;
    }

    /* BOTTOM NAVIGATION */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      box-shadow: 0 -4px 15px rgba(0,0,0,0.05);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      z-index: 100;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 11px;
      color: var(--text-light);
      background: none;
      position: relative;
    }
    .nav-item.active {
      color: var(--accent);
      font-weight: 700;
    }
    .nav-item i {
      margin-bottom: 4px;
      width: 20px;
      height: 20px;
    }
    .badge {
      position: absolute;
      top: -2px;
      right: 4px;
      background: var(--accent);
      color: white;
      font-size: 10px;
      padding: 2px 5px;
      border-radius: 10px;
      font-weight: 700;
    }

    /* VIEWS */
    .view {
      display: none;
      padding: 16px;
      animation: fadeIn 0.3s ease;
    }
    .view.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ONBOARDING / LOGIN OVERLAY */
    #onboarding-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .onboarding-card {
      background: var(--surface);
      border-radius: 24px;
      padding: 28px 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: var(--shadow);
    }
    .role-tabs {
      display: flex;
      background: var(--secondary);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 20px;
    }
    .role-btn {
      flex: 1;
      padding: 10px;
      text-align: center;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      background: transparent;
      transition: 0.3s;
    }
    .role-btn.active {
      background: var(--surface);
      color: var(--accent);
      box-shadow: var(--shadow-sm);
    }
    .step-indicator {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
    }
    .step-dot {
      flex: 1;
      height: 4px;
      background: var(--secondary);
      border-radius: 2px;
    }
    .step-dot.active {
      background: var(--accent);
    }

    /* FORM COMPONENTS */
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }
    .form-control {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid #f0f0f0;
      background: #FAFAFA;
      font-size: 14px;
      transition: 0.3s;
    }
    .form-control:focus {
      border-color: var(--primary);
      background: var(--surface);
      box-shadow: 0 0 0 3px var(--secondary);
    }

    /* BUTTONS */
    .btn {
      width: 100%;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: 0.2s;
    }
    .btn-primary {
      background: var(--accent);
      color: white;
    }
    .btn-primary:active {
      background: var(--accent-dark);
    }
    .btn-secondary {
      background: var(--secondary);
      color: var(--accent);
    }
    .btn-outline {
      border: 1px solid var(--accent);
      color: var(--accent);
      background: transparent;
    }
    .btn-sm {
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 8px;
    }

    /* HOME COMPONENTS */
    .hero-banner {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: var(--radius);
      padding: 20px;
      color: white;
      margin-bottom: 20px;
    }
    .hero-banner h2 { font-size: 20px; margin-bottom: 4px; }
    .hero-banner p { font-size: 12px; opacity: 0.9; }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .horizontal-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 10px;
      scrollbar-width: none;
    }
    .horizontal-scroll::-webkit-scrollbar { display: none; }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .product-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 10px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .product-card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 8px;
    }
    .product-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .product-price {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 4px;
    }
    .product-meta {
      font-size: 10px;
      color: var(--text-light);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }
    .product-actions {
      margin-top: auto;
      display: flex;
      gap: 6px;
    }

    /* PRODUCT DETAIL VIEW */
    .detail-img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      border-radius: var(--radius);
      margin-bottom: 16px;
    }
    .variant-group {
      margin: 14px 0;
    }
    .variant-group label {
      font-size: 12px;
      font-weight: 600;
      display: block;
      margin-bottom: 6px;
    }
    .variant-options {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .variant-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid #e0e0e0;
      background: var(--surface);
      font-size: 12px;
    }
    .variant-btn.selected {
      border-color: var(--accent);
      background: var(--secondary);
      color: var(--accent);
      font-weight: 600;
    }

    /* CART & CHECKOUT */
    .cart-item {
      display: flex;
      gap: 12px;
      background: var(--surface);
      padding: 12px;
      border-radius: var(--radius);
      margin-bottom: 10px;
      align-items: center;
      box-shadow: var(--shadow-sm);
    }
    .cart-item img {
      width: 60px;
      height: 60px;
      border-radius: 8px;
      object-fit: cover;
    }
    .cart-info {
      flex: 1;
    }
    .cart-title { font-size: 13px; font-weight: 600; }
    .cart-variant { font-size: 11px; color: var(--text-light); margin-bottom: 4px; }
    .qty-cnt {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .qty-btn {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: var(--secondary);
      color: var(--accent);
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .summary-card {
      background: var(--surface);
      padding: 16px;
      border-radius: var(--radius);
      margin-top: 16px;
      box-shadow: var(--shadow-sm);
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 8px;
    }
    .summary-row.total {
      font-weight: 700;
      font-size: 15px;
      border-top: 1px dashed #eee;
      padding-top: 8px;
      color: var(--accent);
    }

    /* PROFILE & ORDERS */
    .profile-card {
      background: var(--surface);
      padding: 20px;
      border-radius: var(--radius);
      text-align: center;
      box-shadow: var(--shadow-sm);
      margin-bottom: 16px;
    }
    .avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 8px;
      border: 2px solid var(--primary);
    }

    .timeline {
      display: flex;
      justify-content: space-between;
      margin: 16px 0;
      position: relative;
    }
    .timeline::before {
      content: '';
      position: absolute;
      top: 12px;
      left: 10%;
      right: 10%;
      height: 2px;
      background: #eee;
      z-index: 1;
    }
    .timeline-step {
      position: relative;
      z-index: 2;
      background: var(--bg);
      padding: 0 4px;
      text-align: center;
      font-size: 10px;
    }
    .timeline-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 4px;
    }
    .timeline-step.active .timeline-icon {
      background: var(--accent);
      color: white;
    }

    /* MODAL */
    .modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--surface);
      padding: 20px;
      border-radius: var(--radius);
      width: 100%;
      max-width: 360px;
    }
  </style>
</head>
<body>

  <!-- TOAST NOTIFICATION -->
  <div id="toast"><i data-feather="info"></i> <span id="toast-text">Pesan</span></div>

  <!-- HEADER STICKY -->
  <header class="header">
    <div style="display: flex; align-items: center;">
      <span class="logo">Rara.</span>
      <span class="role-badge" id="header-role-badge">Pelanggan</span>
    </div>
    <div id="header-right">
      <button onclick="switchView('cart')" style="background:none; position:relative;">
        <i data-feather="shopping-bag" style="color:var(--text)"></i>
        <span class="badge" id="cart-badge" style="display:none;">0</span>
      </button>
    </div>
  </header>

  <!-- ONBOARDING & LOGIN OVERLAY -->
  <div id="onboarding-overlay">
    <div class="onboarding-card">
      <div style="text-align: center; margin-bottom: 20px;">
        <h2 style="color: var(--accent);">Rara Cosmetics</h2>
        <p style="font-size: 12px; color: var(--text-light);">Selamat Datang di Beauty & Skincare Store</p>
      </div>

      <!-- ROLE SELECTOR -->
      <div class="role-tabs">
        <button class="role-btn active" id="btn-role-customer" onclick="setRole('customer')">Pelanggan</button>
        <button class="role-btn" id="btn-role-admin" onclick="setRole('admin')">Admin</button>
      </div>

      <!-- CUSTOMER MULTI-STEP ONBOARDING -->
      <div id="customer-flow">
        <div class="step-indicator">
          <div class="step-dot active" id="dot-1"></div>
          <div class="step-dot" id="dot-2"></div>
          <div class="step-dot" id="dot-3"></div>
        </div>

        <form id="form-customer" onsubmit="handleCustomerSubmit(event)">
          <!-- STEP 1 -->
          <div id="step-1">
            <div class="form-group">
              <label>Email Pengguna</label>
              <input type="email" id="cust-email" class="form-control" placeholder="contoh@gmail.com" required>
            </div>
            <button type="button" class="btn btn-primary" onclick="nextStep(2)">Lanjut <i data-feather="arrow-right"></i></button>
          </div>

          <!-- STEP 2 -->
          <div id="step-2" style="display: none;">
            <div class="form-group">
              <label>Username</label>
              <input type="text" id="cust-username" class="form-control" placeholder="Username Anda" required>
            </div>
            <div class="form-group">
              <label>Password</label>
              <input type="password" id="cust-password" class="form-control" placeholder="••••••••" required>
            </div>
            <div style="display: flex; gap: 8px;">
              <button type="button" class="btn btn-secondary" onclick="nextStep(1)">Kembali</button>
              <button type="button" class="btn btn-primary" onclick="nextStep(3)">Lanjut</button>
            </div>
          </div>

          <!-- STEP 3 -->
          <div id="step-3" style="display: none;">
            <div class="form-group">
              <label>Nomor Telepon</label>
              <input type="tel" id="cust-phone" class="form-control" placeholder="08123456789" required>
            </div>
            <div style="display: flex; gap: 8px;">
              <button type="button" class="btn btn-secondary" onclick="nextStep(2)">Kembali</button>
              <button type="submit" class="btn btn-primary">Mulai Belanja</button>
            </div>
          </div>
        </form>
      </div>

      <!-- ADMIN LOGIN FLOW -->
      <div id="admin-flow" style="display: none;">
        <form onsubmit="handleAdminSubmit(event)">
          <div class="form-group">
            <label>Username Admin</label>
            <input type="text" id="admin-username" class="form-control" value="admin" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="admin-password" class="form-control" value="admin123" required>
          </div>
          <button type="submit" class="btn btn-primary">Masuk Portal Admin</button>
        </form>
      </div>

    </div>
  </div>

  <!-- VIEW 1: HOME (CUSTOMER) -->
  <div id="view-home" class="view active">
    <div class="hero-banner">
      <h2>Glow Up Bersama Rara</h2>
      <p>Koleksi kosmetik & skincare original terlengkap!</p>
    </div>

    <!-- BEST SELLER HORIZONTAL -->
    <div class="section-title">
      <span>Best Seller ✨</span>
    </div>
    <div class="horizontal-scroll" id="best-seller-container">
      <!-- Injected by JS -->
    </div>

    <!-- KOLEKSI PILIHAN GRID -->
    <div class="section-title" style="margin-top: 16px;">
      <span>Koleksi Pilihan</span>
    </div>
    <div class="product-grid" id="product-grid-container">
      <!-- Injected by JS -->
    </div>
  </div>

  <!-- VIEW 2: PRODUCT DETAIL -->
  <div id="view-detail" class="view">
    <button onclick="switchView('home')" class="btn btn-secondary btn-sm" style="margin-bottom: 12px; width: auto;">
      <i data-feather="arrow-left"></i> Kembali
    </button>
    <div id="detail-content">
      <!-- Injected by JS -->
    </div>
  </div>

  <!-- VIEW 3: CART & CHECKOUT -->
  <div id="view-cart" class="view">
    <h3 style="margin-bottom: 12px;">Keranjang Belanja</h3>
    <div id="cart-list">
      <!-- Injected by JS -->
    </div>

    <div class="summary-card" id="cart-summary">
      <!-- Injected by JS -->
    </div>
  </div>

  <!-- VIEW 4: ORDERS (STATUS PESANAN) -->
  <div id="view-orders" class="view">
    <h3 style="margin-bottom: 12px;">Status Pesanan Anda</h3>
    <div id="orders-list">
      <!-- Injected by JS -->
    </div>
  </div>

  <!-- VIEW 5: PROFILE (CUSTOMER) -->
  <div id="view-profile" class="view">
    <div class="profile-card">
      <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" class="avatar" alt="Profile">
      <h3 id="profile-name">Nama User</h3>
      <span class="role-badge" style="display:inline-block; margin-top:4px;">Beauty Member</span>
      
      <div style="display: flex; justify-content: space-around; margin-top: 16px; border-top: 1px solid #eee; padding-top: 12px;">
        <div>
          <div style="font-weight: 700; color: var(--accent);" id="prof-order-count">0</div>
          <div style="font-size: 11px; color: var(--text-light);">Pesanan</div>
        </div>
      </div>
    </div>

    <div class="summary-card" style="margin-top: 0;">
      <div class="form-group">
        <label>Email</label>
        <input type="text" id="prof-email" class="form-control" readonly>
      </div>
      <div class="form-group">
        <label>Nomor Telepon</label>
        <input type="text" id="prof-phone" class="form-control" readonly>
      </div>
      <div class="form-group">
        <label>Alamat Pengiriman</label>
        <textarea id="prof-address" class="form-control" rows="2">Jl. Beauty Mawar No. 12, Jakarta</textarea>
      </div>
      <button class="btn btn-outline btn-sm" style="margin-bottom: 8px;" onclick="showToast('Alamat berhasil diperbarui!')">Simpan Profil</button>
      <button class="btn btn-secondary btn-sm" style="color: red;" onclick="openModal('logout-modal')">Logout</button>
    </div>
  </div>

  <!-- VIEW 6: ADMIN DASHBOARD -->
  <div id="view-admin" class="view">
    <h3 style="margin-bottom: 12px;">Panel Admin Rara</h3>
    
    <div class="summary-card" style="margin-bottom: 16px;">
      <h4 style="margin-bottom: 10px;">Tambah Produk Baru</h4>
      <form onsubmit="handleAddProduct(event)">
        <div class="form-group">
          <label>Nama Produk</label>
          <input type="text" id
